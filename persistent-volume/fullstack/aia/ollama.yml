apiVersion: v1
kind: PersistentVolume
metadata:
  name: sloopstash-${ENVIRONMENT}-aia-ollama-0-model
spec:
  storageClassName: sloopstash-aia-ollama-model-local
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/sloopstash/${ENVIRONMENT}/aia/ollama/0/model
  claimRef:
    namespace: sloopstash-${ENVIRONMENT}-aia
    name: ollama-model-ollama-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/os
            operator: In
            values:
              - linux
          - key: node-role.kubernetes.io/worker
            operator: In
            values:
              - worker
          - key: type
            operator: In
            values:
              - on-premise
              - cloud
          - key: provider
            operator: In
            values:
              - host
              - aws
              - azure
              - sloopengine
          - key: service
            operator: In
            values:
              - virtualbox
              - vmware
              - ec2
              - eks
              - aks
              - compute
          - key: region
            operator: In
            values:
              - local
              - ap-south-1
              - centralindia
              - ind-chn-1
          - key: availability_zone
            operator: In
            values:
              - local-b
              - ap-south-1b
              - zone-2
              - ind-chn-1a
---
