apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sloopstash-${ENVIRONMENT}-ctm-nginx-log
spec:
  storageClassName: sloopstash-ctm-nginx-log-local
  volumeName: sloopstash-${ENVIRONMENT}-ctm-nginx-log
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
