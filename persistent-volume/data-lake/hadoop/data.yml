apiVersion: v1
kind: PersistentVolume
metadata:
  name: sloopstash-${ENVIRONMENT}-data-lake-s1-hadoop-data-0-data
spec:
  storageClassName: sloopstash-data-lake-s1-hadoop-data-data-local
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/sloopstash/${ENVIRONMENT}/data-lake/hadoop/data/0/data
  claimRef:
    namespace: sloopstash-${ENVIRONMENT}-data-lake-s1
    name: hadoop-data-hadoop-data-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/os
            operator: In
            values:
              - linux
          - key: node-role.kubernetes.io/worker
            operator: In
            values:
              - worker
          - key: type
            operator: In
            values:
              - on-premise
              - cloud
          - key: provider
            operator: In
            values:
              - host
              - aws
              - azure
              - sloopengine
          - key: service
            operator: In
            values:
              - virtualbox
              - vmware
              - ec2
              - eks
              - aks
              - compute
          - key: region
            operator: In
            values:
              - local
              - ap-south-1
              - centralindia
              - ind-chn-1
          - key: availability_zone
            operator: In
            values:
              - local-c
              - ap-south-1b
              - zone-2
              - ind-chn-1a
---
