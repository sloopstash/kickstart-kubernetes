apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sloopstash-${ENVIRONMENT}-crm-app-log
spec:
  storageClassName: sloopstash-crm-app-log-local
  volumeName: sloopstash-${ENVIRONMENT}-crm-app-log
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
